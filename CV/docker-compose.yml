services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-cvplatform}
      POSTGRES_USER: ${DB_USERNAME:-cvplatform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cvplatform}
    ports:
      - "5433:5432"
    volumes:
      - cv_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cvplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cvplatform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cvplatform-secret}
    ports:
      - "9012:9000" # S3 API
      - "9013:9001" # Web console
    volumes:
      - cv_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cvplatform}
      DB_USERNAME: ${DB_USERNAME:-cvplatform}
      DB_PASSWORD: ${DB_PASSWORD:-cvplatform}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-local-dev-secret-32b}
      JWT_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174}
      PUBLIC_SITE_BASE_URL: ${PUBLIC_SITE_BASE_URL:-http://localhost:5174}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-cvplatform}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-cvplatform-secret}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8082}
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - cv_frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  cv_postgres_data:
  cv_minio_data:
  cv_frontend_node_modules:
