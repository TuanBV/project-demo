spring:
  application:
    name: cv-platform-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cvplatform}
    username: ${DB_USERNAME:cvplatform}
    password: ${DB_PASSWORD:cvplatform}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_FILE_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32bytes}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
  public-site:
    base-url: ${PUBLIC_SITE_BASE_URL:http://localhost:5174}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9012}
    access-key: ${MINIO_ACCESS_KEY:cvplatform}
    secret-key: ${MINIO_SECRET_KEY:cvplatform-secret}
    bucket: ${MINIO_BUCKET:cv-platform-local}
  upload:
    max-pdf-size-bytes: ${UPLOAD_MAX_PDF_SIZE_BYTES:10485760}
  resume:
    trash-retention: ${RESUME_TRASH_RETENTION:30d}
  analytics:
    view-dedup-window: ${ANALYTICS_VIEW_DEDUP_WINDOW:30m}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-capacity-per-window: ${RATE_LIMIT_AUTH_CAPACITY:10}
    auth-window: ${RATE_LIMIT_AUTH_WINDOW:1m}
    public-capacity-per-window: ${RATE_LIMIT_PUBLIC_CAPACITY:60}
    public-window: ${RATE_LIMIT_PUBLIC_WINDOW:1m}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    # Every log line carries the same request correlation id that's also
    # returned to the client (ApiError.traceId, X-Trace-Id header) - see
    # RequestCorrelationFilter.
    level: "%5p [traceId=%X{traceId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
