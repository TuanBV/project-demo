services:
  # FastAPI
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    volumes:
      - ./upload:/api/upload
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./api/.env
    environment:
      # Container-network overrides: api/.env supplies the rest (JWT_SECRET, MAIL_*, ...)
      - MYSQL_HOST_WRITE=mysql
      - MYSQL_HOST_READ=mysql
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_HOST=redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  # FastAPI
  # storage:
  # build:
  #   context: .
  #   dockerfile: Dockerfile.storage
  # container_name: storage
  # volumes:
  #   - ./images:/storage/images
  # ports:
  #   - "9000:9000"
  # networks:
  #   - backend

  # Redis
  redis:
    image: "redis:alpine"
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
  # Queue
  # queue:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.queue
  #   container_name: queue
  #   ports:
  #     - "9000:9000"
  #   networks:
  #     - backend

  # Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: worker
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - backend

  # Celery_beat
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: celery_beat
    restart: always
    depends_on:
      worker:
        condition: service_started
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: ["celery", "-A", "worker", "beat", "--loglevel=info"]
    networks:
      - backend

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: database
    environment:
      # Placeholder defaults for a fresh clone; override in a root .env (gitignored, see .env.example)
      # to match the real MYSQL_PASSWORD/MYSQL_DB values in api/.env.
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DB:-nike}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # Frontend
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.frontend
  #   container_name: frontend
  #   restart: always
  #   ports:
  #     - "5000:5000"
  #   networks:
  #     - backend

# Network and volume
networks:
  backend:
    driver: bridge

volumes:
  mysql-data:
