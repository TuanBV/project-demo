services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Interview Review System
      - APP_ENV=production
      - DEBUG=false
      # Default: SQLite file persisted in the ./data volume.
      # To use Postgres instead, uncomment the `db` service below and set:
      # - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/interview_review
      - DATABASE_URL=sqlite:////app/data/app.db
      - MAX_DOCX_UPLOAD_SIZE_MB=10
      - MAX_TEXT_IMPORT_SIZE_KB=2048
      - EVALUATOR_MODE=keyword
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    restart: unless-stopped

